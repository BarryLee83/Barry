<!doctype html>
<html lang="zh-CN" data-theme="cyberpunk">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; connect-src 'self'; font-src 'self';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SCUM Server Switcher</title>
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="app-frame">
      <header class="titlebar">
        <div class="brand">
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 64 64" width="38" height="38">
              <defs>
                <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="var(--accent)" />
                  <stop offset="1" stop-color="var(--accent-2)" />
                </linearGradient>
              </defs>
              <rect x="3" y="3" width="58" height="58" rx="17" fill="var(--logo-bg, #101827)" stroke="url(#logoGrad)" stroke-width="2.5" />
              <path d="M17 26h24l-6.5-6.5" fill="none" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M47 38H23l6.5 6.5" fill="none" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
          <div class="brand-text">
            <h1 data-i18n="app.title">SCUM 私服切换器</h1>
            <span data-i18n="app.subtitle">一键切换存档与 MOD</span>
          </div>
        </div>

        <div class="status-strip" id="statusStrip">
          <span class="pill" id="pillGame" data-state="unknown"></span>
          <span class="pill" id="pillLauncher" data-state="unknown"></span>
          <span class="pill" id="pillCurrent" data-state="unknown"></span>
        </div>

        <div class="titlebar-actions">
          <button class="icon-btn" id="btnLang" title="Language" aria-label="Language">EN</button>
          <button class="icon-btn" id="btnTheme" title="Theme" aria-label="Theme">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="12" r="8.5"></circle>
              <path d="M12 3.5v17M3.5 12h17" stroke-linecap="round"></path>
            </svg>
          </button>
          <button class="icon-btn" id="btnAdmin" title="Admin commands" aria-label="Admin commands">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="4" width="18" height="16" rx="3"></rect>
              <path d="M7 9l3 3-3 3M12.5 15H17" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </button>
          <button class="icon-btn" id="btnSettings" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="12" r="3.2"></circle>
              <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 8.96 4.6H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"></path>
            </svg>
          </button>
        </div>
      </header>

      <main class="layout">
        <section class="card profiles-card">
          <div class="card-head">
            <div>
              <h2 data-i18n="profiles.title">服务器配置</h2>
              <p class="muted" data-i18n="profiles.hint">选择一个目标配置，然后点击切换</p>
            </div>
            <button class="ghost small" id="btnAddProfile">
              <span class="plus">+</span>
              <span data-i18n="profiles.add">添加</span>
            </button>
          </div>

          <div id="currentBanner" class="current-banner"></div>
          <div id="profileList" class="profile-list" role="radiogroup"></div>

          <div class="tool-row">
            <button class="tool" data-tool="admin">
              <span class="tool-icon">⌘</span>
              <span data-i18n="tools.admin">管理员指令</span>
            </button>
            <button class="tool" data-tool="map">
              <span class="tool-icon">◎</span>
              <span data-i18n="tools.map">地图与坐标</span>
            </button>
            <button class="tool" data-tool="mods">
              <span class="tool-icon">▦</span>
              <span data-i18n="tools.mods">MOD 检查</span>
            </button>
          </div>
        </section>

        <section class="card switch-card">
          <div class="route" id="route">
            <div class="route-node" id="fromNode"></div>
            <div class="route-arrow" aria-hidden="true">
              <span></span>
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 12h15M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </div>
            <div class="route-node" id="toNode"></div>
          </div>

          <div class="switch-summary" id="switchSummary"></div>

          <button class="primary xl" id="btnSwitch" disabled>
            <span class="switch-label" data-i18n="switch.button">切换配置</span>
          </button>

          <div class="inline-actions">
            <button class="ghost small" id="btnLaunchCurrent" hidden></button>
            <button class="ghost small" id="btnChangeCurrent" hidden></button>
          </div>

          <div class="progress-block" id="progressBlock" hidden>
            <div class="progress-head">
              <span id="progressLabel"></span>
              <span id="progressPercent">0%</span>
            </div>
            <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
            <button class="danger small" id="btnCancel" data-i18n="switch.cancel">取消切换</button>
          </div>

          <div class="steps-wrap">
            <div class="section-label" data-i18n="steps.title">切换步骤</div>
            <div class="steps" id="stepList"></div>
          </div>

          <div class="log-block">
            <div class="log-head">
              <span class="section-label" data-i18n="log.title">日志</span>
              <button class="ghost tiny" id="btnClearLog" data-i18n="log.clear">清空</button>
            </div>
            <div class="log-list" id="logList"></div>
          </div>
        </section>
      </main>

      <footer class="statusbar">
        <span id="footerPath" class="path-text"></span>
        <span id="footerVersion" class="version-text"></span>
      </footer>
    </div>

    <div id="modalRoot"></div>
    <div id="toastRoot" class="toast-root"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
